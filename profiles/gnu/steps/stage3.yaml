mchroot:
  defaults:
    template: stage3.tmpl

  steps:
    - none: |
        # Do this so we have an updated tree if resuming from here:
        {% if target == "armv7a-unknown-linux-gnueabihf" %}
        cat > /etc/ego.conf << "EGO_EOF"
        [global]
        release = mark-31
        python_kit_profile = mark
        sync_base_url = https://github.com/macaroni-os/{repo}
        EGO_EOF
        {% elif target == "i686-pc-linux-gnu" %}
        cat > /etc/ego.conf << "EGO_EOF"
        [global]
        release = mark-iii
        python_kit_profile = mark
        sync_base_url = https://github.com/macaroni-os/{repo}
        EGO_EOF
        {% elif ego_arch is defined and ego_subarch is defined %}
        cat > /etc/ego.conf << "EGO_EOF"
        [global]
        release = mark-iii
        python_kit_profile = mark
        sync_base_url = https://github.com/macaroni-os/{repo}
        EGO_EOF
        {% endif %}
        GIT_SSL_NO_VERIFY=true ego sync

        # Do this before setting ROOT:
        /usr/sbin/env-update
        /sbin/ldconfig
        source /etc/profile

        epro flavor core
        epro mix-ins -stage1

        export LANG=C
        export LC_ALL=C
        export CONFIG_PROTECT="-*"
        export FEATURES="-pid-sandbox nodoc noman noinfo"

        export GIT_CONFIG_GLOBAL=/dev/null
        export GIT_DISCOVERY_ACROSS_FILESYSTEM=0
        export GIT_CEILING_DIRECTORIES=/var/tmp/portage:/tmp:/
        export GOFLAGS="-buildvcs=false"


        install -d /tmp/stage1root/var/git
        {% if target == "armv7a-unknown-linux-gnueabihf" %}
        sed -i s,'armv7','armv7*',g var/git/meta-repo/kits/lang-kit/dev-lang/go/go-1.26.3.ebuild
        {% endif %}
        echo '>=media-libs/freetype-2.14.3 png' >> /etc/portage/package.use
        echo 'net-firewall/iptables ipv6 nftables' >> /etc/portage/package.use
        echo '>=x11-libs/cairo-1.18.4 X' >> /etc/portage/package.use
        echo 'net-firewall/iptables ipv6 nftables' >> /etc/portage/package.use
        epro mix-ins +X +lxqt
        rsync -aH --delete --numeric-ids /var/git/ /tmp/stage1root/var/git/
        rsync -aH --delete --numeric-ids /etc/portage/ /tmp/stage1root/etc/portage/
        echo -e '127.0.0.1 localhost\n::1 localhost ip6-localhost ip6-loopback' > /etc/hosts
        export FEATURES="-sandbox -usersandbox -pid-sandbox network-sandbox nodoc noman noinfo preserve-libs userpriv"
        emerge sys-libs/glibc --jobs=3
        emerge dev-libs/libpcre2 --jobs=3
        emerge -uD world --jobs=3
        emerge $({ find /var/db/pkg -mindepth 2 -maxdepth 2 -type d ! -exec test -f "{}/COUNTER" \; -print; find /var/db/pkg -name COUNTER -exec sh -c 'grep -qx 0 "$1" && dirname "$1"' _ {} \;; } | sed 's|^/var/db/pkg/||; s|-[^-]*$||' | sort -u) sys-devel/m4 --jobs 3
        USE="-dbus" emerge dev-libs/glib --jobs=3
        emerge -1 dev-libs/gobject-introspection --jobs=3 --exclude poppler
        emerge dev-libs/glib --jobs=3
        emerge dev-lang/vala --jobs=3
        emerge -1 dev-lang/go --jobs=3
    - none-stage3: |
        # Do this so we have an updated tree if resuming from here:
        echo -e '[global]\nrelease = mark-31\npython_kit_profile = mark\nsync_base_url = https://github.com/macaroni-os/{repo}' > /etc/ego.conf
        #GIT_SSL_NO_VERIFY=true ego sync

        # Do this before setting ROOT:
        /usr/sbin/env-update
        /sbin/ldconfig
        source /etc/profile

        epro flavor core
        epro mix-ins -stage1

        export LANG=C
        export LC_ALL=C
        export CONFIG_PROTECT="-*"
        export FEATURES="-pid-sandbox nodoc noman noinfo"

        export GIT_CONFIG_GLOBAL=/dev/null
        export GIT_DISCOVERY_ACROSS_FILESYSTEM=0
        export GIT_CEILING_DIRECTORIES=/var/tmp/portage:/tmp:/
        export GOFLAGS="-buildvcs=false"


        export ROOT=/tmp/stage1root
        export PORTAGE_CONFIGROOT=/tmp/stage1root
        cp /etc/ego.conf ${ROOT}/etc/ego.conf

        epro mix-ins -stage1
        epro flavor core
        epro mix-ins +X +lxqt

        emerge -1 sys-apps/sysvinit --jobs=3

        USE="-pam" emerge -1 sys-apps/shadow --jobs=3
        USE="-elogind" emerge -1 sys-libs/pam --jobs=3
        echo -e '127.0.0.1 localhost\n::1 localhost ip6-localhost ip6-loopback' > /etc/hosts
        emerge sys-libs/glibc --jobs=3
        emerge dev-lang/vala --jobs=3
        emerge -1 sys-auth/pambase --jobs=3
        emerge dev-libs/libpcre2 --jobs=3
        export FEATURES="-sandbox -usersandbox -pid-sandbox network-sandbox nodoc noman noinfo preserve-libs userpriv"
        emerge -uD world --jobs=3
        USE="-dbus" emerge dev-libs/glib --jobs=3
        emerge -1 dev-libs/gobject-introspection --jobs=3 --exclude poppler
        echo '>=media-libs/freetype-2.14.3 png' >> ${ROOT}/etc/portage/package.use
        echo '>=x11-libs/cairo-1.18.4 X' >> ${ROOT}/etc/portage/package.use
        emerge dev-libs/glib --jobs=3
        emerge gnome-base/dconf --jobs=3
        emerge -1 sys-auth/elogind --jobs=3
        emerge -1 sys-apps/shadow --jobs=3
        emerge -1 sys-apps/openrc --jobs=3
        emerge gcc --jobs=3
        emerge sys-libs/glibc --jobs=3
        emerge app-arch/xz-utils --jobs=3
        emerge app-text/poppler --jobs=3
        emerge sys-devel/binutils sys-devel/libtool sys-devel/make sys-devel/pkgconf --jobs=3
        emerge app-admin/anise-portage-converter --jobs=3

    - none-final: |
        {% if target == "armv7a-unknown-linux-gnueabihf" %}
        install -d /var/overlay/overlay-local/profiles
        install -d /var/overlay/overlay-local/metadata
        install -d /var/overlay/overlay-local/sys-boot/u-boot-bananapi
        install -d /etc/portage/repos.conf

        echo overlay-local > /var/overlay/overlay-local/profiles/repo_name

        printf '%s\n' 'sys-boot' \
          > /var/overlay/overlay-local/profiles/categories

        printf '%s\n' \
          'thin-manifests = true' \
          'sign-manifests = false' \
          'profile-formats = portage-2' \
          'cache-formats = md5-dict' \
          'masters = core-kit' \
          > /var/overlay/overlay-local/metadata/layout.conf

        printf '%s\n' \
          '[overlay-local]' \
          'location = /var/overlay/overlay-local' \
          'auto-sync = no' \
          'priority = 10' \
          > /etc/portage/repos.conf/overlay-local
        export ROOT=/tmp/stage1root

        wget --no-check-certificate -O /var/overlay/overlay-local/sys-boot/u-boot-bananapi/u-boot-bananapi-2026.04.ebuild https://raw.githubusercontent.com/coffnix/coffnix-ebuilds/refs/heads/master/sys-boot/u-boot-bananapi/u-boot-bananapi-2026.04.ebuild

        ebuild /var/overlay/overlay-local/sys-boot/u-boot-bananapi/u-boot-bananapi-2026.04.ebuild manifest
        emerge sys-boot/u-boot-bananapi

        emerge sys-kernel/vanilla-sources
        emerge sys-libs/ncurses
        emerge dev-embedded/u-boot-tools

        export PORTAGE_CONFIGROOT=/tmp/stage1root
        cd ${ROOT}/usr/src/linux

        #make ARCH=arm sunxi_defconfig
        make ARCH=arm olddefconfig

        make ARCH=arm -j$(nproc) zImage modules dtbs
        make ARCH=arm INSTALL_MOD_PATH=${ROOT} modules_install

        install -d ${ROOT}/boot
        install -d ${ROOT}/boot/dtb

        install -m 0644 arch/arm/boot/zImage \
          ${ROOT}/boot/zImage

        find arch/arm/boot/dts/ -type f -name 'sun7i-a20-*.dtb' \
          -exec install -m 0644 {} ${ROOT}/boot/dtb/ \;

        cp -f \
          arch/arm/boot/dts/allwinner/sun7i-a20-bananapro.dtb \
          ${ROOT}/boot/dtb/sun7i-a20-bananapro.dtb 2>/dev/null || \
        cp -f \
          arch/arm/boot/dts/sun7i-a20-bananapro.dtb \
          ${ROOT}/boot/dtb/sun7i-a20-bananapro.dtb

        install -d ${ROOT}/etc

        printf '%s\n' \
          'UUID=e9f90286-197d-4ed4-a459-94ea0514c252  /  ext4  defaults,noatime  0 1' \
          > ${ROOT}/etc/fstab

        printf '%s\n' \
          'setenv bootargs console=ttyS0,115200 console=tty1 root=UUID=e9f90286-197d-4ed4-a459-94ea0514c252 rootwait rootfstype=ext4 panic=10' \
          '' \
          'load mmc 0:1 0x42000000 boot/zImage' \
          'load mmc 0:1 0x43000000 boot/dtb/sun7i-a20-bananapro.dtb' \
          '' \
          'bootz 0x42000000 - 0x43000000' \
          > ${ROOT}/boot/boot.cmd

        ${ROOT}/usr/bin/mkimage -C none -A arm -T script \
          -d ${ROOT}/boot/boot.cmd \
          ${ROOT}/boot/boot.scr
        emerge gcc kmod --jobs 3
        gcc-config 1
        env-update
        ldconfig
        find /usr/lib -type f -name '*.so*' -exec chmod 755 {} \;
        find /lib -type f -name '*.so*' -exec chmod 755 {} \;
        export ROOT=/tmp/stage1root
        export PORTAGE_CONFIGROOT=/tmp/stage1root
        pwconv
        grpconv

        emerge net-misc/openssh --jobs 3
        emerge man-db --jobs 3
        sys-auth/polkit --jobs 3
        emerge sys-apps/net-tools --jobs 3
        emerge net-misc/ntp --jobs 3
        emerge sys-kernel/linux-firmware --jobs 3
        rc-update add ntp-client
        rc-update add sshd
        echo 'PermitRootLogin yes' >> /etc/ssh/sshd_config
        emerge app-editors/vim --jobs 3
        emerge sys-kernel/dracut --jobs 3
        emerge sys-apps/lm_sensors sys-process/htop app-arch/gzip --jobs 3
        emerge app-misc/ca-certificates --jobs 3
        emerge dev-libs/icu --jobs 3
        emerge app-portage/genlop --jobs 3
        ldconfig
        emerge sys-devel/automake sys-devel/autoconf sys-devel/libtool --jobs 3
        emerge x11-misc/shared-mime-info --jobs 3
        update-ca-certificates
        update-mime-database /usr/share/mime
        eselect vi set vim
        export ROOT=
        # root password
        echo -e "root\nroot" | passwd root
        chage -M 99999 -E -1 -I -1 root
        chage -d 0 root
        cp /etc/passwd /tmp/stage1root/etc
        cp /etc/shadow /tmp/stage1root/etc
        cp /etc/group /tmp/stage1root/etc
        locale-gen -d /tmp/stage1root
        > /tmp/stage1root/etc/portage/make.conf
        #  fim arm32

        {% elif target == "x86_64-pc-linux-gnu" or target == "x86_64-unknown-linux-gnu" %}

        ego profile mix-ins +kernel-sid

        emerge sys-kernel/debian-sources:sid

        cd ${ROOT}/usr/src/linux

        make olddefconfig

        make -j$(nproc)

        make INSTALL_MOD_PATH=${ROOT} modules_install

        install -d ${ROOT}/boot

        install -m 0644 arch/x86/boot/bzImage \
          ${ROOT}/boot/kernel

        {% elif target == "aarch64-unknown-linux-gnu" %}
        emerge sys-kernel/vanilla-sources

        cd ${ROOT}/usr/src/linux

        make ARCH=arm64 defconfig
        make ARCH=arm64 olddefconfig

        make ARCH=arm64 -j$(nproc) Image modules dtbs
        make ARCH=arm64 INSTALL_MOD_PATH=${ROOT} modules_install

        install -d ${ROOT}/boot
        install -d ${ROOT}/boot/dtb

        install -m 0644 arch/arm64/boot/Image \
          ${ROOT}/boot/kernel

        find arch/arm64/boot/dts/ -type f -name '*.dtb' \
          -exec install -m 0644 {} ${ROOT}/boot/dtb/ \;

        #{% else %}
        #emerge sys-kernel/vanilla-sources

        #cd ${ROOT}/usr/src/linux

        #make olddefconfig

        #make -j$(nproc)

        #make INSTALL_MOD_PATH=${ROOT} modules_install

        #install -d ${ROOT}/boot
        {% endif %}
